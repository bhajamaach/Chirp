<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/overlay.css" />
    <title>Chirp overlay</title>
  </head>
  <body>
    <div id="mascot" data-state="idle" aria-hidden="true">
      <svg viewBox="0 0 120 120" width="120" height="120">
        <!-- antenna -->
        <rect class="fill" x="58" y="14" width="4" height="14" rx="2" />
        <circle class="fill" cx="60" cy="12" r="6" />
        <!-- head -->
        <rect class="fill head" x="20" y="26" width="80" height="70" rx="30" />
        <!-- eyes, one group per mood -->
        <g class="eyes idle">
          <rect x="35" y="59" width="16" height="5" rx="2.5" />
          <rect x="69" y="59" width="16" height="5" rx="2.5" />
        </g>
        <g class="eyes listening">
          <rect x="38" y="46" width="10" height="26" rx="5" />
          <rect x="72" y="46" width="10" height="26" rx="5" />
        </g>
        <g class="eyes thinking">
          <circle cx="40" cy="61" r="5" />
          <circle class="mid" cx="60" cy="61" r="8" />
          <circle cx="80" cy="61" r="5" />
        </g>
        <g class="eyes done">
          <path d="M33 66 Q40 56 47 66" fill="none" stroke-width="5" stroke-linecap="round" />
          <path d="M73 66 Q80 56 87 66" fill="none" stroke-width="5" stroke-linecap="round" />
        </g>
        <!-- sound pills, shown while listening -->
        <g class="pills fill">
          <rect x="30" y="103" width="6" height="8" rx="3" />
          <rect x="42" y="100" width="6" height="14" rx="3" />
          <rect x="54" y="97" width="6" height="20" rx="3" />
          <rect x="66" y="100" width="6" height="14" rx="3" />
          <rect x="78" y="103" width="6" height="8" rx="3" />
        </g>
        <!-- sparkle, shown when done -->
        <g class="sparkle fill">
          <rect x="104" y="16" width="4" height="14" rx="2" />
          <rect x="99" y="21" width="14" height="4" rx="2" />
        </g>
        <!-- highlight ring, shown while acting -->
        <rect class="ring" x="14" y="20" width="92" height="82" rx="36" fill="none" stroke-width="4" />
      </svg>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
