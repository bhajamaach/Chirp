[package]
name = "chirp"
version = "0.1.0"
description = "Voice-first computer control for blind and low-vision people"
authors = ["Chirp"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chirp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
earshot = "1.2.2"
hound = "3.5.1"
dotenvy = "0.15.7"
base64 = "0.23.1"
futures-util = "0.3.34"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
ureq = { version = "3", features = ["json"] }
tokio = { version = "1.54.0", features = ["sync", "time", "rt", "macros"] }


# The echo search in the interrupt detector runs in real time, which an
# unoptimised debug build cannot always keep up with.
[profile.dev]
opt-level = 1

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-av-foundation = "0.3.2"
objc2-foundation = "0.3.2"
